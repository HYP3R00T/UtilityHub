[tools]
git-cliff = "latest"
prek = "latest"
node = "lts"
pnpm = "latest"
python = "3.14"
rumdl = "latest"
shellcheck = { version = "latest", os = ["linux", "macos"] }
tombi = "latest"
uv = "latest"

[settings]
experimental = true
idiomatic_version_file_enable_tools = ["python"]

[hooks]
enter = "bash ./scripts/enter_project.sh"

[env]
_.file = ".env"  # for sensitive data
UV_LINK_MODE = "copy"

[tasks.check]
description = "Python type checker and language server"
run = "uv run ty check"

[tasks.test]
description = "Test all packages"
run = "uv run pytest --cov=. --cov-report=term-missing"

[tasks.docs]
run = "uv run zensical serve"
description = "Serve the documentation locally"
