[global]
flavor = "standard"
disable = [
  "MD010", # No hard tabs
  "MD013", # Line length
  "MD033", # No inline HTML
  "MD034", # No bare URLs
  "MD036", # No emphasis as heading
  "MD037", # Spaces around emphasis
  "MD039", # No space in links
  "MD044", # Proper names
  "MD046", # Code block style
  "MD049", # Emphasis style
  "MD059", # Link text
  "MD060", # Table format
]

# Exclude generated or temporary content
exclude = []

[code-block-tools]
enabled = true
on-error = "fail"
on-missing-tool-binary = "fail"

[code-block-tools.languages]
python = { lint = ["ruff:format"], format = ["ruff:format"] }
